# This file is optional. Any canonical field can be overridden with a matching
# FLUX__SECTION__FIELD environment variable; environment values take priority.
[kafka]
bootstrap_servers = ["localhost:9092"]
group_id = "vehicle-signal-processor"
topics = ["vehicle-signals"]
client_id = "vehicle-signal-processor"
# Required policy: choose earliest, latest, or error deliberately.
auto_offset_reset = "earliest"

# Broker commits remain automatic. The application updates librdkafka's local
# offset store immediately whenever the safe completion prefix advances.
auto_commit_interval_ms = 5000
session_timeout_ms = 45000
max_poll_interval_ms = 300000
prefetch_max_kbytes = 16384

[ingress]
# A record must own capacity from both budgets before it enters the work queue.
work_queue_capacity = 2048
completion_queue_capacity = 2048
memory_budget_bytes = 67108864
max_payload_bytes = 1048576

[ingress.backpressure]
# Pause when either application budget reaches 80%; resume only after both
# budgets fall to 50% or lower.
pause_high_watermark_percent = 80
resume_low_watermark_percent = 50

[object_processing]
# Validated work is distributed through a bounded MPMC queue. Each worker
# processes at most one object at a time.
queue_capacity = 256
worker_count = 8
# Maximum accepted metadata `size` value, in bytes (1 GiB).
max_object_size = 1073741824

[s3]
# Credentials are resolved by the standard AWS environment/profile/role chain
# and are never stored in this file.
region = "us-east-1"
# endpoint_url = "http://localhost:9000"
force_path_style = false
# max_attempts includes the initial request.
max_attempts = 3
connect_timeout_ms = 3000
operation_attempt_timeout_ms = 30000
operation_timeout_ms = 120000
# Request timeouts stop once GetObject returns; this separately bounds a
# stalled response body between chunks.
stream_idle_timeout_ms = 20000

[shutdown]
# On expiry, commit only the ACKed safe prefix and exit non-zero.
grace_ms = 30000
