[package]
name = "flux"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
expect_used = "deny"
unwrap_used = "deny"

[dependencies]
anyhow = "1"
aws-config = { version = "=1.11.0", features = ["behavior-version-latest"] }
aws-sdk-s3 = { version = "=1.144.0", features = ["behavior-version-latest"] }
bytes = "1"
config = { version = "=0.15.25", default-features = false, features = ["toml"] }
flume = "0.11"
rdkafka = { version = "0.39", features = ["cmake-build"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
aws-sdk-s3 = { version = "=1.144.0", features = ["test-util"] }
aws-smithy-http-client = { version = "=1.4.0", features = ["test-util"] }
aws-smithy-types = "=1.6.2"
http = "1"
http-body = "1"
testcontainers-modules = { version = "0.15", features = ["kafka"] }
