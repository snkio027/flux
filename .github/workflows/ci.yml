name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install librdkafka build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libcurl4-openssl-dev
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Unit and mock Kafka tests
        run: cargo test --locked --all-targets --all-features

  real-kafka:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install librdkafka build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libcurl4-openssl-dev
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Real Kafka crash/restart replay gate
        run: cargo test --locked --test kafka_real -- --ignored --nocapture
